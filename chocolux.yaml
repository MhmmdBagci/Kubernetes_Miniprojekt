apiVersion: apps/v1
kind: Deployment
metadata:
  name: chocolux
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chocolux
  template:
    metadata:
      labels:
        app: chocolux
    spec:
      containers:
      - name: chocolux
        image: chocolux-website
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10

---

apiVersion: v1
kind: Service
metadata:
  name: chocolux-service
spec:
  type: NodePort
  selector:
    app: chocolux
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080

---

apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: chocolux
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chocolux
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
